<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AURA, an AI that sits beside you</title>
<meta name="description" content="A self-hosted AI desktop companion and software development OS. Try her five natures, watch the routing, and see exactly how much of her is built. MIT licensed, runs on your own machine.">
<meta name="theme-color" content="#0A0912">

<meta property="og:type" content="website">
<meta property="og:title" content="AURA, an AI that sits beside you">
<meta property="og:description" content="Pick a nature and ask her something. Same question, five different people. Self-hosted, MIT licensed.">
<meta property="og:image" content="assets/lance.webp">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230A0912'/><circle cx='16' cy='16' r='7.5' fill='none' stroke='%238B5CFF' stroke-width='2.2'/><path d='M2 16h28' stroke='%23EAE7F6' stroke-width='1.4'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#demo">Skip to the demo</a>

<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="#top" aria-label="AURA, home">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="7.5" fill="none" stroke="#8B5CFF" stroke-width="2.2"/>
        <path d="M1 16h30" stroke="#EAE7F6" stroke-width="1.4"/>
      </svg>
      <span>AURA</span>
    </a>
    <div class="nav__links">
      <a href="#demo">Demo</a>
      <a href="#halves">What she does</a>
      <a href="#stage">Current stage</a>
      <a href="#install">Install</a>
      <a class="btn btn--go" id="nav-src" href="#">View the source</a>
    </div>
  </div>
</header>

<main id="main">

  <!-- ====================================== hero, deliberately short ==== -->
  <section class="hero" id="top">
    <div class="hero__media">
      <img src="assets/horizon.webp" alt="" width="1344" height="756" fetchpriority="high">
    </div>
    <div class="hero__scrim"></div>
    <div class="wrap hero__in" id="hero"></div>
  </section>

  <!-- ============================================== THE DEMO =========== -->
  <section class="demo" id="demo">
    <div class="wrap">
      <div class="sect__head" id="demo-head"></div>

      <div class="picker" id="nature-picker" role="radiogroup" aria-label="Choose a nature"></div>
      <p class="picker__note" id="nature-note" aria-live="polite"></p>

      <div class="stagepair">
        <!-- left: the conversation -->
        <div class="chat" id="chat-panel">
          <div class="chat__bar" aria-hidden="true">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            <span class="chat__title" id="chat-title">AURA</span>
          </div>
          <div class="chat__log" id="chat-log" role="log" aria-live="polite"></div>
          <div class="chat__asks" id="chat-asks"></div>
          <div class="chat__input">
            <input type="text" id="fake-input" disabled
                   placeholder="Pick a question above. The real one takes typing, and your voice.">
            <span class="chat__hint" aria-hidden="true">scripted</span>
          </div>
        </div>

        <!-- right: what actually happened -->
        <aside class="pipe" id="pipe-panel" aria-label="How the answer was produced">
          <p class="pipe__head">What just happened</p>
          <ol class="pipe__steps" id="pipe-steps"></ol>
          <div class="pipe__overlay" id="pipe-overlay"></div>
          <div class="pipe__guard" id="pipe-guard"></div>
        </aside>
      </div>

      <p class="honesty" id="demo-honesty"></p>
    </div>
  </section>

  <!-- the current stage, stated immediately -->
  <div class="strip"><div class="wrap strip__in" id="strip"></div></div>

  <!-- ===================================================== two halves -->
  <section class="sect" id="halves">
    <div class="wrap">
      <div class="sect__head" id="halves-head"></div>
      <div class="halves" id="halves-grid"></div>
      <div id="fig-halves"></div>
    </div>
  </section>

  <!-- ================================================== THE LEDGER ==== -->
  <section class="sect" id="stage">
    <div class="wrap">
      <div class="sect__head" id="stage-head"></div>
      <div class="filters" id="stage-filters" role="group" aria-label="Filter capabilities by state"></div>
      <div class="ledger" id="ledger"></div>
    </div>
  </section>

  <!-- ====================================================== the ladder -->
  <section class="sect" id="ladder">
    <div class="wrap">
      <div class="sect__head" id="ladder-head"></div>
      <div class="ladder" id="ladder-rungs"></div>
      <div class="ladder__ctl">
        <label for="rung-range" class="vh">Permission rung</label>
        <input type="range" id="rung-range" min="1" max="5" value="1" step="1">
        <output id="rung-out"></output>
      </div>
    </div>
  </section>

  <!-- ===================================================== getting in -->
  <section class="sect" id="install">
    <div class="wrap">
      <div class="sect__head" id="install-head"></div>
      <div class="steps" id="install-steps"></div>
      <p class="requires" id="install-req"></p>
    </div>
  </section>

  <!-- ============================================================= faq -->
  <section class="sect" id="faq">
    <div class="wrap">
      <div class="sect__head" id="faq-head"></div>
      <div class="qa" id="faq-list"></div>
    </div>
  </section>

  <!-- =========================================================== close -->
  <section class="close" id="close">
    <div class="close__bg"><img src="assets/lance.webp" alt="" loading="lazy"></div>
    <div class="close__scrim"></div>
    <div class="wrap close__in" id="close-in"></div>
  </section>

</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<noscript>
  <div class="wrap" style="padding:40px 28px">
    <p>The demo and the capability ledger render from <code>content.js</code>.
    Enable JavaScript, or read the project's README for the same information.</p>
  </div>
</noscript>

<script src="content.js"></script>
<script src="site.js"></script>
</body>
</html>
